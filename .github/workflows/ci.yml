# Continuous integration for Keel.
# The job runs the same gates as tools/check.sh so CI and the workstation agree.
name: ci

# CI runs for a release, not while a phase of work is open. The release
# restores the push and pull_request triggers and owns the first run.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Go version comes from go.mod so CI matches the local toolchain.
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Tests that shell out to ffmpeg need one static binary pair.
      # The digest pins the image so every run gets the same build.
      - name: Install static ffmpeg and ffprobe
        run: |
          cid=$(docker create mwader/static-ffmpeg:7.1@sha256:a8090df5f5608daef387e1b2e93b98aaacb4d92153ad904e7d715c725724fca4)
          docker cp "${cid}:/ffmpeg" /usr/local/bin/ffmpeg
          docker cp "${cid}:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$cid"

      # Tests that shell out to ffmpeg read KEEL_REQUIRE_FFMPEG.
      # An unset variable makes those tests skip when a binary is missing.
      # CI sets the variable here so a missing binary fails the run instead.
      # The gate also diffs the exported API against the frozen records under
      # api/, so a signature change fails this run and prints the difference.
      - name: Run every quality gate
        run: KEEL_REQUIRE_FFMPEG=1 tools/check.sh
